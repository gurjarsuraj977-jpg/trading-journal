<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostTrader V2.3</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="auth"><div class="card auth"><b class="logo">GHOSTTRADER</b><p>Trade in silence. Execute with precision.</p><form id="af"><input id="an" placeholder="Name" class="reg"><input id="ae" type="email" placeholder="Email" required><input id="ap" type="password" placeholder="Password" required><button>Login</button></form><button id="switch" class="link">Create account</button></div></div>
<div id="app" class="hide"><aside><b class="logo">GHOSTTRADER</b><small>JOURNAL V2.3</small><nav><button data-p="dashboard">Dashboard</button><button data-p="trades">Trades</button><button data-p="calendar">Calendar</button><button data-p="analytics">Analytics</button><button data-p="accounts">Accounts</button></nav><button id="logout">Log out</button></aside><main><header><div><small>GHOSTTRADER / JOURNAL</small><h1 id="title">Dashboard</h1></div><div><button id="export">Export CSV</button><button id="add">+ Add Trade</button></div></header>
<section id="dashboard" class="page"><div id="stats" class="stats"></div><div class="grid"><div class="card"><h2>Equity Curve</h2><canvas id="chart"></canvas></div><div class="card"><h2>Performance</h2><div id="perf"></div></div></div><div class="card"><h2>Recent Trades</h2><div id="recent"></div></div></section>
<section id="trades" class="page hide"><div class="card filters"><input id="fs" placeholder="Symbol"><select id="fd"><option value="">Direction</option><option>BUY</option><option>SELL</option></select><select id="fr"><option value="">Result</option><option value="win">Wins</option><option value="loss">Losses</option></select><button id="cf">Clear</button></div><div class="card"><div id="tradeTable"></div></div></section>
<section id="calendar" class="page hide"><div class="card"><div class="calhead"><button id="prev">←</button><h2 id="mt"></h2><button id="next">→</button></div><div class="week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="gridcal" class="cal"></div></div></section>
<section id="analytics" class="page hide"><div id="astats" class="stats"></div><div class="grid"><div class="card"><h2>By Symbol</h2><div id="sym"></div></div><div class="card"><h2>By Strategy</h2><div id="strat"></div></div><div class="card"><h2>By Session</h2><div id="sess"></div></div><div class="card"><h2>By Direction</h2><div id="dir"></div></div></div></section>
<section id="accounts" class="page hide"><div class="card"><div class="row"><h2>Accounts</h2><button id="newacc">+ Add Account</button></div><div id="accountsList"></div></div></section></main></div>
<div id="modal" class="modal hide"><div class="card modalcard"><button id="close" class="x">×</button><h2 id="mh">Add Trade</h2><form id="tf" class="form">
<input id="tid" type="hidden"><label>Account<select id="ta"></select></label><label>Symbol<input id="ts" required placeholder="XAUUSD"></label><label>Direction<select id="td"><option>BUY</option><option>SELL</option></select></label><label>Date<input id="tt" type="datetime-local" required></label><label>Entry<input id="te" type="number" step="any" required></label><label>Stop Loss<input id="sl" type="number" step="any"></label><label>Take Profit<input id="tp" type="number" step="any"></label><label>Exit<input id="ex" type="number" step="any"></label><label>Quantity<input id="qty" type="number" step="any" value="1"></label><label>Risk $<input id="risk" type="number" step="any" value="0"></label><label>Risk %<input id="riskp" type="number" step="any" value="0"></label><label>P&L<input id="pl" type="number" step="any" value="0"></label><label>Planned R:R<input id="prr" type="number" step="any"></label><label>Actual R<input id="ar" type="number" step="any"></label><label>Strategy<input id="strategy"></label><label>Setup<input id="setup"></label><label>Session<select id="session"><option></option><option>Asia</option><option>London</option><option>New York</option><option>London/NY</option></select></label><label>Market Condition<select id="mc"><option></option><option>Trending</option><option>Ranging</option><option>Volatile</option><option>Choppy</option><option>News</option></select></label><label>Confidence<input id="conf" type="number" min="0" max="100"></label><label>Emotion Before<input id="eb"></label><label>Emotion After<input id="ea"></label><label class="full">Mistakes<input id="mist"></label><label class="full">Entry Reason<textarea id="er"></textarea></label><label class="full">Exit Reason<textarea id="xr"></textarea></label><label class="full">Notes<textarea id="notes"></textarea></label><label class="full">Chart Screenshot<input id="shot" type="file" accept="image/*"></label></form><button id="save">Save Trade</button></div></div>
<script src="/app.js"></script></body></html>
